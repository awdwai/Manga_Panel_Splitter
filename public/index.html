<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZuhoBooks — Local Accounting</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <div id="app" class="app">
      <aside class="sidebar" id="sidebar">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">Z</div>
          <div class="brand-text">
            <strong>ZuhoBooks</strong>
            <span id="org-name-side">My Organization</span>
          </div>
        </div>

        <nav class="nav" aria-label="Main">
          <button class="nav-item active" data-view="dashboard">
            <span class="nav-icon">⌂</span> Dashboard
          </button>
          <div class="nav-group">Sales</div>
          <button class="nav-item" data-view="invoices">
            <span class="nav-icon">▣</span> Invoices
          </button>
          <div class="nav-group">Purchases</div>
          <button class="nav-item" data-view="expenses">
            <span class="nav-icon">▭</span> Expenses
          </button>
          <button class="nav-item" data-view="bills">
            <span class="nav-icon">▤</span> Bills
          </button>
          <div class="nav-group">People</div>
          <button class="nav-item" data-view="contacts">
            <span class="nav-icon">◎</span> Contacts
          </button>
          <div class="nav-group">Insights</div>
          <button class="nav-item" data-view="reports">
            <span class="nav-icon">▥</span> Reports
          </button>
          <button class="nav-item" data-view="settings">
            <span class="nav-icon">⚙</span> Settings
          </button>
        </nav>

        <div class="sidebar-foot">
          <div class="persist-badge" title="Saved to local JSON file on the server">
            <span class="dot"></span> Local save on
          </div>
        </div>
      </aside>

      <div class="main-wrap">
        <header class="topbar">
          <button class="menu-btn" id="menu-btn" aria-label="Toggle menu">☰</button>
          <div class="topbar-title">
            <h1 id="page-title">Dashboard</h1>
            <p id="page-sub">Your business finances at a glance</p>
          </div>
          <div class="topbar-actions">
            <button class="btn btn-ghost" id="btn-refresh" title="Reload data">Refresh</button>
            <button class="btn btn-primary" id="btn-quick-create">+ New</button>
          </div>
        </header>

        <main class="content" id="content"></main>
      </div>
    </div>

    <div class="modal-backdrop" id="modal-backdrop" hidden>
      <div class="modal" id="modal" role="dialog" aria-modal="true">
        <div class="modal-head">
          <h2 id="modal-title">Dialog</h2>
          <button class="icon-btn" id="modal-close" aria-label="Close">×</button>
        </div>
        <div class="modal-body" id="modal-body"></div>
        <div class="modal-foot" id="modal-foot"></div>
      </div>
    </div>

    <div class="toast" id="toast" hidden></div>

    <script src="/js/app.js"></script>
  </body>
</html>
